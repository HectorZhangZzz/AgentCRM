# Local CRM deployment overrides.
# Keep this file on the Mac mini. It protects local runtime settings when the base compose file is updated.
services:
  server:
    ports:
      - "30002:3000"
    environment:
      SERVER_URL: ${SERVER_URL}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      IS_CONFIG_VARIABLES_IN_DB_ENABLED: ${IS_CONFIG_VARIABLES_IN_DB_ENABLED:-true}
      AI_PROVIDERS: ${AI_PROVIDERS}
      AI_MODEL_PREFERENCES: ${AI_MODEL_PREFERENCES}

  worker:
    environment:
      SERVER_URL: ${SERVER_URL}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      IS_CONFIG_VARIABLES_IN_DB_ENABLED: ${IS_CONFIG_VARIABLES_IN_DB_ENABLED:-true}
      AI_PROVIDERS: ${AI_PROVIDERS}
      AI_MODEL_PREFERENCES: ${AI_MODEL_PREFERENCES}
